name: mirror-sync

# Nightly git sync (WOOW addon pipeline release-gating #216, parent #191): pulls
# homeassistant-ai/ha-mcp `master`, adds a snapshot of it to the `upstream`
# branch, then rebuilds `master` from that snapshot with our overlay on top.
# Same steps as the other five Mirror sources (#166; this file follows
# Woow_ha_music_assistant_add_on's, the whole upstream tree, no pruning), with
# two differences:
#   - no image-mirror and no image: rewrite. ha_mcp's config.yaml names the
#     images upstream prebuilds (ghcr.io/homeassistant-ai/ha-mcp-addon-*); the
#     webhook proxy is built on the device. Users install those images as they are.
#   - a version ceiling (版本上限) per shipped add-on, see below.
#
# `master` only moves forward. Each sync rebuilds the tree from upstream and
# commits it on top of the previous `master`; it is never force-pushed.
# Woow_HA_App_Store pins published add-on snapshots by commit and accepts a
# new snapshot only when it descends from the one it already has, so a
# rewritten `master` would block every later release. The WOOWTECH commits from
# before the switch (#216) stay in `master`'s history; the WOOWTECH integration
# (custom_components/ha_mcp_tools 1.2.4) lives on branch `woowtech/ha-mcp-tools`
# (#215), not here: the one on `master` is upstream's.
#
# Upstream's `.github` folder (its CI configuration) is not copied anywhere.
# GitHub does not let this workflow's token push workflow files. The `upstream`
# branch therefore holds upstream's source without `.github`, one snapshot
# commit per change, and is never force-pushed. Upstream tags are not copied:
# they point at upstream commits, `.github` included.
#
# Nothing ships unchecked (pipeline #91). After the sync, in this order:
#   1. the Store's upgrade comparison (sha mode) compares each add-on whose
#      version differs from its latest formal Release with that Release:
#      categories 1-4. An add-on above its version ceiling is held (暫緩)
#      before that: not compared, tested or released, and the run stays green
#      with a "Held (暫緩)" step (the monitor shows it apart from a failure);
#   2. the Store's Release workflow creates a Release only for the add-ons
#      that passed (`components`). Any add-on that failed fails this run; the
#      others still get their Release.
# On the schedule, steps 1-2 run only when the sync pushed a new commit.
# workflow_dispatch always runs them, so after adding a declaration or raising
# a ceiling a manual run checks the same upstream version again. The dev
# channels (homeassistant-addon-dev, homeassistant-addon-webhook-proxy-dev)
# never reach the Store and are neither compared nor released.
#
# Overlay files live in .mirror/<add-on dir>/: version-ceiling.yaml (the
# version ceiling), upgrade-check/ (hooks, settings) and upgrade-notes.yaml
# (declared breaking changes, with the migration). The rebuild copies them into
# <add-on dir>/, where the Store tools read them. A breaking upstream change
# that is intended: declare it in .mirror/<add-on dir>/upgrade-notes.yaml,
# commit, then run this workflow by hand; the declaration goes into the
# Release notes. Raising a ceiling: edit .mirror/<add-on dir>/version-ceiling.yaml
# (only after the shipping HA can run that version; docs/woowtech-fork-sync.md),
# commit, run this workflow by hand.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: mirror-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      changed: ${{ steps.push.outputs.changed }}
    steps:
      - name: Checkout master (with full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Snapshot overlay files
        run: |
          set -e
          mkdir -p /tmp/overlay/docs
          # Copy overlay (files we add on top of upstream)
          [ -d .github ] && cp -a .github /tmp/overlay/
          [ -d .mirror ] && cp -a .mirror /tmp/overlay/
          [ -f docs/woowtech-fork-sync.md ] && cp -a docs/woowtech-fork-sync.md /tmp/overlay/docs/
          echo "Overlay snapshot:"; find /tmp/overlay -maxdepth 3 -type f

      - name: Load mirror config
        run: |
          set -a
          . .mirror/config.env
          set +a
          echo "UPSTREAM_URL=$UPSTREAM_URL"       >> $GITHUB_ENV
          echo "UPSTREAM_BRANCH=$UPSTREAM_BRANCH" >> $GITHUB_ENV

      - name: Fetch upstream source
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH" --no-tags

      - name: Update upstream source snapshot branch
        run: |
          set -euo pipefail
          # Upstream's tree without `.github`, built in a scratch index.
          export GIT_INDEX_FILE="$RUNNER_TEMP/upstream-snapshot.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "upstream/$UPSTREAM_BRANCH"
          git rm -r -q --cached --ignore-unmatch .github
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          parent=$(git rev-parse --verify -q refs/remotes/origin/upstream || true)
          if [ -n "$parent" ] && [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
            echo "Upstream snapshot unchanged."
            exit 0
          fi
          upstream_commit=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
          export GIT_AUTHOR_NAME="WOOWTECH Mirror Bot" GIT_COMMITTER_NAME="WOOWTECH Mirror Bot"
          export GIT_AUTHOR_EMAIL="woowtech-mirror-bot@designsmart.com.tw" GIT_COMMITTER_EMAIL="woowtech-mirror-bot@designsmart.com.tw"
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} \
            -m "[bot] upstream snapshot ${UPSTREAM_URL##*/}@${upstream_commit} without .github")
          # A normal push: the snapshot sits on top of the previous one (the first one has no parent).
          git push origin "$commit:refs/heads/upstream"

      - name: Rebuild master = upstream + overlay
        run: |
          set -e
          # Keep `master` checked out and replace its index and work tree with
          # upstream's tree, so the commit below sits on top of the old master.
          git checkout master
          git read-tree --reset -u "upstream/$UPSTREAM_BRANCH"
          # Upstream's CI configuration is not part of the add-on.
          rm -rf .github

          # Re-apply overlay
          cp -a /tmp/overlay/. .
          # Version ceiling (#216) and upgrade comparison hooks and declarations (pipeline #91):
          # .mirror/<add-on dir>/{version-ceiling.yaml,upgrade-check/,upgrade-notes.yaml} -> <add-on dir>/
          for src in .mirror/*/; do
            [ -d "$src" ] || continue
            addon=$(basename "$src")
            if [ ! -d "$addon" ]; then
              echo "::warning::.mirror/$addon/ has no add-on directory $addon/ upstream; not copied"
              continue
            fi
            if [ -d "$src/upgrade-check" ]; then
              rm -rf "$addon/upgrade-check"
              cp -a "$src/upgrade-check" "$addon/upgrade-check"
              echo "Copied .mirror/$addon/upgrade-check/ into $addon/"
            fi
            for f in upgrade-notes.yaml version-ceiling.yaml; do
              if [ -f "$src/$f" ]; then
                cp -a "$src/$f" "$addon/$f"
                echo "Copied .mirror/$addon/$f into $addon/"
              fi
            done
          done
          # Refresh last-sync stamp
          {
            echo "last_sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "upstream_url: $UPSTREAM_URL"
            echo "upstream_branch: $UPSTREAM_BRANCH"
            echo "upstream_commit: $(git rev-parse upstream/$UPSTREAM_BRANCH)"
          } > .mirror/last-sync.yaml

      - name: Commit & push master
        id: push
        run: |
          git config user.email "woowtech-mirror-bot@designsmart.com.tw"
          git config user.name  "WOOWTECH Mirror Bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes; skipping commit."
            changed=false
          else
            git commit -m "[bot] mirror sync $(date -u +%Y-%m-%d) — ${UPSTREAM_URL##*/}@${UPSTREAM_BRANCH}"
            changed=true
          fi
          git push origin master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # 1. Upgrade comparison (sha mode, Store #167): each add-on whose version is not
  # its latest formal Release's is compared with that Release; one above its version
  # ceiling is held instead (Store, #216). Scheduled runs go on only when the sync
  # pushed a commit; a manual run always does. Its output `passed` is the JSON array
  # of the add-ons that passed, `held` of those held; any failed add-on fails this
  # job and so the run.
  upgrade-comparison:
    name: Upgrade comparison
    needs: sync
    if: needs.sync.outputs.sha != '' && (needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      actions: read
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-upgrade-check.yml@main
    with:
      sha: ${{ needs.sync.outputs.sha }}

  # 2. The App Store ships only formal Releases (registry ref_policy: release; the
  # seed Releases ha_mcp-v7.14.1 and ha_mcp_webhook_proxy-v2.0.4 were made by hand
  # on the last pre-mirror master, #216). Release the pushed commit for the add-ons
  # that passed only (Store #168): each gets its <slug>-v<version> Release, with its
  # upgrade-notes.yaml declarations in the notes. It runs also when the comparison
  # failed (some add-ons may have passed), but never without a list: an empty
  # `components` would release every add-on, so "" (the comparison did not run or
  # gave no output) skips it, and so does [] (none passed, or all held).
  release:
    name: Release
    needs: [sync, upgrade-comparison]
    if: >-
      ${{ !cancelled()
      && needs.sync.result == 'success'
      && (needs.upgrade-comparison.result == 'success' || needs.upgrade-comparison.result == 'failure')
      && needs.upgrade-comparison.outputs.passed != ''
      && needs.upgrade-comparison.outputs.passed != '[]' }}
    permissions:
      contents: write
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-release.yml@main
    with:
      sha: ${{ needs.sync.outputs.sha }}
      components: ${{ needs.upgrade-comparison.outputs.passed }}
